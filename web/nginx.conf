server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # config.js is regenerated from the environment at every container
    # start (see docker-entrypoint.sh) — never let the browser cache a stale
    # copy pointing at the wrong backend.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
